services:
  mongodb:
    image: mongo:7
    container_name: parcial_acortador_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: parcial_acortador_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
